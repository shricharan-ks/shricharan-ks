name: GitHub Stats

on:
  schedule:
    - cron: "3 6 * * *"
  workflow_dispatch:

jobs:
  github-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Renders commits / PRs / review activity only.
      # The community and repositories bases are deliberately omitted: on this
      # account they render as a wall of zeros (0 orgs, 0 sponsors, 0 releases,
      # 0 stargazers, 0 forkers) that weakens the profile rather than selling it.
      - name: Generate GitHub Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: shricharan-ks
          filename: github-stats.svg
          committer_branch: stats
          template: classic
          base: header, activity
          # indepth walks deeper history: without it the commit count reports
          # 290 instead of the true 471.
          base_indepth: yes
          config_timezone: Europe/Dublin
          config_display: large
          # half-year, not full-year: the same commits spread over twice the
          # window halves the "average per day" figure the calendar prints.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
